<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Quiz App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">
    <link rel="icon" href="tab_logo.jpg" type="image/jpg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            color: #212529;
            font-family: 'Poppins', sans-serif;
        }
        .rating-container {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .rating-stars {
            font-size: 40px;
            color: #ddd; /* Default gray for stars */
            cursor: pointer;
        }
        .rating-stars span {
            margin: 0 5px;
        }
        .rating-stars span.hover,
        .rating-stars span.selected {
            color: #ffc107; /* Highlight color for stars (yellow) */
        }
        .rating-feedback {
            margin-top: 20px;
        }
        .rating-feedback textarea {
            width: 100%;
            height: 100px;
            border-radius: 5px;
            border: 1px solid #ddd;
            padding: 10px;
            font-size: 16px;
            resize: none;
        }
        .rating-feedback button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #343a40;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .rating-feedback button:hover {
            background-color: #212529;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Rating Form -->
        <div class="rating-container">
    <h1>Rate Quiz App</h1>
    <p class="mt-3">We'd love to hear your feedback!</p>
    <div class="rating-stars mt-4" id="rating-stars">
        <span data-value="1">&#9733;</span>
        <span data-value="2">&#9733;</span>
        <span data-value="3">&#9733;</span>
        <span data-value="4">&#9733;</span>
        <span data-value="5">&#9733;</span>
    </div>
    <div class="rating-feedback mt-4">
        <textarea id="feedback" placeholder="Leave your feedback here..."></textarea>
        <button id="submit-rating">Submit</button>
    </div>
</div>

<script>
    // Rating Logic
    const stars = document.querySelectorAll('.rating-stars span');
    const ratingContainer = document.getElementById('rating-stars');
    let selectedRating = 0;

    stars.forEach(star => {
        star.addEventListener('mouseover', function () {
            const rating = this.getAttribute('data-value');
            highlightStars(rating);
        });

        star.addEventListener('mouseout', function () {
            if (selectedRating === 0) {
                resetStars();
            } else {
                highlightStars(selectedRating);
            }
        });
    });

    stars.forEach(star => {
        star.addEventListener('click', function () {
            selectedRating = this.getAttribute('data-value');
            highlightStars(selectedRating);
        });
    });

    function highlightStars(rating) {
        stars.forEach(star => {
            const starValue = star.getAttribute('data-value');
            if (starValue <= rating) {
                star.classList.add('selected');
            } else {
                star.classList.remove('selected');
            }
        });
    }

    function resetStars() {
        stars.forEach(star => {
            star.classList.remove('selected');
        });
    }

    // Submit rating with beautified feedback
    document.getElementById('submit-rating').addEventListener('click', function () {
        const feedback = document.getElementById('feedback').value.trim();
        if (selectedRating === 0) {
            toastr.error('Please select a star rating.', 'Error!');
            return;
        }
        toastr.success(`Rating: ${selectedRating} stars <br> Message: ${feedback || 'No feedback provided'}`, 'Thank you for your feedback!');
    });

        // Submit rating
        document.getElementById('submit-rating').addEventListener('click', function () {
            const feedback = document.getElementById('feedback').value.trim();
            if (selectedRating === 0) {
                alert('Please select a star rating.');
                return;
            }
            alert(`Thank you for your feedback! \nRating: ${selectedRating} stars \nMessage: ${feedback}`);
        });
    </script>
</body>
</html>
